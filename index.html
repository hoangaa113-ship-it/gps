<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEATSHIELD - Giám Sát Sốc Nhiệt</title>
  <style>
    /* ===== 1. TÔNG MÀU DARK MODE TỐI ƯU NGOÀI TRỜI ===== */
    :root {
      --bg-main: #0b1120;
      --bg-card: #162032;
      --border-card: #263449;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --safe-green: #10b981;
      --warn-yellow: #f59e0b;
      --warn-orange: #f97316;
      --danger-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 16px;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ===== 2. THANH TRẠNG THÁI KẾT NỐI TRÊN CÙNG ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      margin-bottom: 14px;
    }
    .brand { font-weight: 800; letter-spacing: 0.5px; font-size: 1.1rem; }
    .ble-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-weight: 600;
    }
    .ble-badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    /* ===== 3. HỘP CẢNH BÁO TRẠNG THÁI (XANH / VÀNG / CAM / ĐỎ) ===== */
    .alert-banner {
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      border-left: 6px solid var(--safe-green);
      background: rgba(16, 185, 129, 0.12);
      transition: all 0.3s ease;
    }
    .alert-banner.level-1 {
      border-left-color: var(--warn-yellow);
      background: rgba(245, 158, 11, 0.18);
    }
    .alert-banner.level-2 {
      border-left-color: var(--warn-orange);
      background: rgba(249, 115, 22, 0.22);
    }
    .alert-banner.level-3 {
      border-left-color: var(--danger-red);
      background: rgba(239, 68, 68, 0.28);
      animation: pulseAlert 1s infinite;
    }
    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    .alert-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .alert-desc { font-size: 0.85rem; color: var(--text-muted); }

    /* ===== 4. LƯỚI CHỈ SỐ SINH TỒN LỚN (THÂN NHIỆT & NHỊP TIM) ===== */
    .vital-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px;
    }
    .card-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .vital-value { font-size: 2rem; font-weight: 800; line-height: 1.1; }
    .vital-unit { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }

    /* ===== 5. THÔNG SỐ MÔI TRƯỜNG, VẬN ĐỘNG & GPS ===== */
    .info-list { margin-bottom: 16px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-card);
      font-size: 0.9rem;
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-val { font-weight: 600; }

    /* ===== 6. CÁC NÚT ĐIỀU KHIỂN & NÚT SOS KHẨN CẤP ===== */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-connect { background: var(--accent-blue); color: #fff; }
    .btn-connect:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .btn-sos {
      background: var(--danger-red);
      color: #fff;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <!-- Thanh trạng thái -->
  <div class="top-bar">
    <div class="brand">HEATSHIELD</div>
    <div class="ble-badge" id="bleStatus">Chưa kết nối BLE</div>
  </div>

  <!-- Hộp phân cấp cảnh báo -->
  <div class="alert-banner" id="alertBox">
    <div class="alert-title" id="alertTitle">Trạng thái: Bình thường</div>
    <div class="alert-desc" id="alertDesc">Các chỉ số sinh tồn trong ngưỡng an toàn.</div>
  </div>

  <!-- Chỉ số sinh tồn chính -->
  <div class="vital-grid">
    <div class="card">
      <div class="card-label">THÂN NHIỆT (GY-906)</div>
      <div class="vital-value"><span id="tempVal">--</span><span class="vital-unit">°C</span></div>
    </div>
    <div class="card">
      <div class="card-label">NHỊP TIM (XD-58C)</div>
      <div class="vital-value"><span id="bpmVal">--</span><span class="vital-unit">BPM</span></div>
    </div>
  </div>

  <!-- Thông số vận động, môi trường & GPS -->
  <div class="card info-list">
    <div class="info-row">
      <span class="card-label">Trạng thái vận động</span>
      <span class="info-val" id="actVal">Chờ dữ liệu...</span>
    </div>
    <div class="info-row">
      <span class="card-label">Thời tiết ngoài trời</span>
      <span class="info-val" id="weatherVal">Đang lấy dữ liệu...</span>
    </div>
    <div class="info-row">
      <span class="card-label">Tọa độ A-GPS</span>
      <span class="info-val" id="gpsVal">--</span>
    </div>
  </div>

  <!-- Nút thao tác -->
  <button class="btn btn-connect" id="btnConnect">KẾT NỐI BĂNG ĐEO (HEATSHIELD-S3)</button>
  <button class="btn btn-sos" id="btnSOS">GỬI SOS KHẨN CẤP</button>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let rxChar = null;
    let currentGPS = { lat: 0, lon: 0 };

    // Cập nhật giao diện theo gói CSV từ ESP32: t,h,s,a,l
    function updateDashboard(csv) {
      const parts = csv.trim().split(',');
      if (parts.length < 5) return;

      const temp = parseFloat(parts[0]);
      const bpm  = parseInt(parts[1]);
      const act  = parseInt(parts[3]);
      const lvl  = parseInt(parts[4]);

      document.getElementById('tempVal').textContent = temp > 0 ? temp.toFixed(1) : '--';
      document.getElementById('bpmVal').textContent  = bpm > 0 ? bpm : '--';

      const actNames = ['Đang nghỉ', 'Đang vận động', 'Chờ hủy báo ngã', 'PHÁT HIỆN TÉ NGÃ'];
      document.getElementById('actVal').textContent = actNames[act] || 'Không xác định';

      const box = document.getElementById('alertBox');
      const title = document.getElementById('alertTitle');
      const desc = document.getElementById('alertDesc');
      box.className = 'alert-banner level-' + lvl;

      if (lvl === 0) {
        title.textContent = 'Mức Xanh: An toàn';
        desc.textContent = 'Chỉ số ổn định, tiếp tục theo dõi.';
      } else if (lvl === 1) {
        title.textContent = 'Mức Vàng: Cảnh báo sớm';
        desc.textContent = 'Thân nhiệt hoặc nhịp tim tăng. Nên uống nước, nghỉ mát.';
      } else if (lvl === 2) {
        title.textContent = 'Mức Cam: Nguy cơ cao';
        desc.textContent = 'Cần dừng việc ngay lập tức và hạ nhiệt cơ thể!';
      } else {
        title.textContent = 'MỨC ĐỎ: KHẨN CẤP / SOS';
        desc.textContent = 'Đang kích hoạt cảnh báo nguy hiểm và tọa độ cứu hộ!';
      }
    }

    // Lấy GPS + Thời tiết Open-Meteo và gửi xuống ESP32
    async function syncWeatherAndGPS() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        currentGPS = { lat, lon };
        document.getElementById('gpsVal').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m`);
          const data = await res.json();
          const t = data.current.temperature_2m;
          const h = data.current.relative_humidity_2m;
          document.getElementById('weatherVal').textContent = `${t}°C | Độ ẩm ${h}%`;

          if (rxChar) {
            const payload = `${t.toFixed(1)},${Math.round(h)},${lat.toFixed(6)},${lon.toFixed(6)}`;
            await rxChar.writeValueWithoutResponse(new TextEncoder().encode(payload));
          }
        } catch (e) {
          console.error('Lỗi tải thời tiết:', e);
        }
      });
    }

    document.getElementById('btnConnect').addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'HeatShield-S3' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_CHAR_UUID);

        const txChar = await service.getCharacteristic(TX_CHAR_UUID);
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', e => {
          const str = new TextDecoder().decode(e.target.value);
          updateDashboard(str);
        });

        const badge = document.getElementById('bleStatus');
        badge.textContent = 'Đã kết nối BLE';
        badge.classList.add('connected');
        document.getElementById('btnConnect').disabled = true;

        syncWeatherAndGPS();
        setInterval(syncWeatherAndGPS, 300000);
      } catch (err) {
        alert('Không thể kết nối BLE: ' + err.message);
      }
    });

    document.getElementById('btnSOS').addEventListener('click', () => {
      const mapLink = `https://maps.google.com/?q=${currentGPS.lat},${currentGPS.lon}`;
      alert(`ĐÃ KÍCH HOẠT TÍN HIỆU SOS!\nVị trí cứu hộ: ${mapLink}`);
    });
  </script>
</body>
</html>
